<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Institut</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-tauler" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
  <symbol id="i-calendari" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-notes" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-forums" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.2L21 16"/><path d="M21 21v-5h-5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-brand" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10 14M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
</defs></svg>
<a class="skip" href="#main">Salta al contingut</a>
<header class="side">
  <div class="brand"><svg class="ic" aria-hidden="true"><use href="#i-brand"/></svg>Institut</div>
  <div class="foot">
    <button id="sync" type="button" class="icon" aria-label="Sincronitza" title="Sincronitza"><svg class="ic" aria-hidden="true"><use href="#i-sync"/></svg></button>
    <button id="keys" class="icon" type="button" aria-label="Dreceres de teclat" title="Dreceres de teclat"><svg class="ic" aria-hidden="true"><use href="#i-keys"/></svg></button>
    <button id="theme" class="icon" type="button" aria-label="Tema fosc" aria-pressed="true"><svg class="ic" aria-hidden="true"><use id="theme-use" href="#i-moon"/></svg></button>
    <small id="lastsync" role="status"></small>
  </div>
  <nav class="tabs" aria-label="Seccions">
    <a href="#/tauler"><svg class="ic" aria-hidden="true"><use href="#i-tauler"/></svg><span>Tauler</span></a>
    <a href="#/calendari"><svg class="ic" aria-hidden="true"><use href="#i-calendari"/></svg><span>Calendari</span></a>
    <a href="#/fitxers"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg><span>Fitxers</span></a>
    <a href="#/notes"><svg class="ic" aria-hidden="true"><use href="#i-notes"/></svg><span>Notes</span></a>
    <a href="#/organitza"><svg class="ic" aria-hidden="true"><use href="#i-sync"/></svg><span>Organitza</span></a>
    <a href="#/forums"><svg class="ic" aria-hidden="true"><use href="#i-forums"/></svg><span>Fòrums</span><span class="pill" id="forum-pill" hidden></span></a>
  </nav>
  <div class="sec" aria-hidden="true" hidden>Cursos</div>
  <nav class="courses" id="courses" aria-label="Cursos" hidden></nav>
  <div id="scan-slot"></div>
  <p id="live" class="sr-only" role="status"></p>
  <div id="toast" class="toast">
    <p id="toast-s" role="status"></p>
    <p id="toast-e" role="alert"></p>
    <button id="toast-u" type="button" hidden>Desfés</button>
    <button id="toast-x" type="button" class="ghost icon" aria-label="Tanca el missatge" hidden><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
</header>
<div class="col">
  <div class="stack">
    <div id="banner" class="banner" role="alert" hidden></div>
    <div id="auth-banner" class="banner auth" role="status" hidden><svg class="ic" aria-hidden="true"><use href="#i-warn"/></svg><span id="auth-msg"></span><button id="auth-renew" type="button">Renova</button></div>
  </div>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-labelledby="dlg-t" aria-describedby="dlg-b"><form method="dialog"><h2 id="dlg-t"></h2><div id="dlg-b"></div>
  <menu><button value="no" type="submit">Cancel·la</button><button value="ok" type="submit" class="primary" id="dlg-ok">D'acord</button></menu></form></dialog>
<dialog id="pal" aria-label="Cerca i salta" class="pal"><input id="pal-q" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pal-l" aria-label="Cerca" placeholder="Cerca tasques, cursos, fitxers…" autocomplete="off" spellcheck="false"><p id="pal-n" class="sr-only" role="status"></p><ul id="pal-l" role="listbox" aria-label="Resultats"></ul></dialog>
<script src="/app.js"></script>
</body>
</html>
